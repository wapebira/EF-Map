#[ Netlify root configuration ]
# Ensures builds run from the front-end app subdirectory and functions are detected.

[build]
  base = "eve-frontier-map"
  publish = "eve-frontier-map/dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # The functions directory is relative to the build base above. Since base is
  # already set to "eve-frontier-map", we only need the path inside that dir.
  directory = "netlify/functions"
  node_bundler = "esbuild"
