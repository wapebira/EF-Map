#[ Netlify root configuration ]
# Ensures builds run from the front-end app subdirectory and functions are detected.

[build]
  base = "eve-frontier-map"
  publish = "eve-frontier-map/dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # With [build].base set to \"eve-frontier-map\", the functions directory path is resolved *relative to that base*.
  # Previous value incorrectly prefixed the base again (eve-frontier-map/netlify/functions), so functions were not deployed.
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cache the large SQLite bundle aggressively (versioned via filename when changed).
[[headers]]
  for = "/map_data.db"
  [headers.values]
    # One year; safe because we'll rename (e.g. map_data.v2.db) when contents change.
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Single Page App: route all non-file paths (except functions/assets) to index.html
# Ensures deep links like /stats load the React app instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
