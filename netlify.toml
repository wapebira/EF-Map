#[ Netlify root configuration ]
# Ensures builds run from the front-end app subdirectory and functions are detected.

[build]
  base = "eve-frontier-map"
  publish = "eve-frontier-map/dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # IMPORTANT: The functions directory path here is relative to the repository root (monorepo pattern).
  # Because our functions actually live inside the subdirectory specified by [build].base, we must include that prefix.
  # Reference: https://docs.netlify.com/configure-builds/file-based-configuration/#functions
  directory = "eve-frontier-map/netlify/functions"
  node_bundler = "esbuild"

# Cache the large SQLite bundle aggressively (versioned via filename when changed).
[[headers]]
  for = "/map_data.db"
  [headers.values]
    # One year; safe because we'll rename (e.g. map_data.v2.db) when contents change.
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Single Page App: route all non-file paths (except functions/assets) to index.html
# Ensures deep links like /stats load the React app instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
