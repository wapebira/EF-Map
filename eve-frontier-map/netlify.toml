[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Optional: enforce edge function regions or other settings later

[[headers]]
  for = "/map_data.db"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# SPA catch-all so deep links (/stats, etc.) load index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200