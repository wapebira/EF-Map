      SMARTASSEMBLIES_FLAT_INTERVAL_MIN: "0"
      SMARTASSEMBLIES_DETAILS_INTERVAL_MIN: "0"
      TRIBES_INTERVAL_MIN: "0"
      TRIBES_DETAILS_INTERVAL_MIN: "0"
      TYPES_INTERVAL_MIN: "0"
      SOLARSYSTEMS_INTERVAL_MIN: "0"
      SOLARSYSTEMS_DETAILS_INTERVAL_MIN: "0"
      KILLMAILS_INTERVAL_MIN: "0"
    volumes:
