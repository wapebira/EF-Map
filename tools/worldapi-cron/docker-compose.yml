services:
  # Shared image build once
  base-image:
    build:
      context: ../..
      dockerfile: tools/worldapi-cron/Dockerfile
    image: ef-worldapi-cron:local
    networks:
      - indexer-network

  # Snapshot exporter: publishes smart_gate_links_v1 to Cloudflare KV from local Postgres
  snapshot-exporter:
    build:
      context: ../..
      dockerfile: tools/snapshot-exporter/Dockerfile
    image: ef-snapshot-exporter:local
    restart: unless-stopped
    environment:
      # Postgres (Primordium reader)
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: user
      PGPASSWORD: password
      STRUCTURE_SCHEMA: "0x7085f3e652987f656fb8dee5aa6592197bb75de8"
      # Cloudflare (provide actual values via env or Docker secrets at runtime)
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      CF_API_TOKEN: ${CF_API_TOKEN}
      KV_NAMESPACE_ID: ${EF_SNAPSHOTS_NAMESPACE_ID}
      # Behavior
      ONLY_ONLINE: "1"
      DRY_RUN: ${SNAPSHOT_DRY_RUN:-0}
      LOG_JSON: "1"
      # Ensure remote writes (Cloudflare API) rather than local: set FORCE_REMOTE=1
      FORCE_REMOTE: "1"
    networks:
      - indexer-network
    healthcheck:
      test: ["CMD-SHELL", "wrangler --version >/dev/null 2>&1 || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s

  # Killmails: 1-2 min tail-only
  worldapi-cron-killmails:
    image: ef-worldapi-cron:local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      DESTINATION__POSTGRES__CREDENTIALS__HOST: postgres
      DESTINATION__POSTGRES__CREDENTIALS__PORT: "5432"
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: postgres
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: user
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: password
      BASE_URL: https://world-api-stillness.live.tech.evefrontier.com
      TZ: UTC
      DLT_DATA_DIR: /app/.dlt-killmails
      PIPELINE_NAME: worldapi_pipeline_killmails
      DATASET_NAME: world_api_dlt
      FORCE_ALLOW_RESOURCES: get_v_2_killmails
      KILLMAILS_INTERVAL_MIN: "1"
      KILLMAILS_OFFSET_MIN: "0"
      KILLMAILS_PAGE_SIZE: "10"
      KILLMAILS_MAX_OLD_PAGES: "60"
      KILLMAILS_BACKFILL: "0"
      KILLMAILS_BACKFILL_MAX_PAGES: "1000"
      # Disable forced resets now that initial backfill ran
      KILLMAILS_FORCE_RESET: "0"
      # Disable others explicitly
      SMARTASSEMBLIES_FLAT_INTERVAL_MIN: "0"
      SMARTASSEMBLIES_DETAILS_INTERVAL_MIN: "0"
      SMARTCHARACTERS_INTERVAL_MIN: "0"
      SMARTCHARACTERS_DETAILS_INTERVAL_MIN: "0"
      TRIBES_INTERVAL_MIN: "0"
      TRIBES_DETAILS_INTERVAL_MIN: "0"
      TYPES_INTERVAL_MIN: "0"
      SOLARSYSTEMS_INTERVAL_MIN: "0"
      SOLARSYSTEMS_DETAILS_INTERVAL_MIN: "0"
    volumes:
      - worldapi_dlt_state_killmails:/app/.dlt-killmails
    networks:
      - indexer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $$POSTGRES_HOST -p $$POSTGRES_PORT -U $$POSTGRES_USER || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Smartassemblies flat list: fast (2m)
